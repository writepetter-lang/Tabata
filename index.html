<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interval Timer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Geist:wght@400;500;600&display=swap">
<style>
/* One-screen app: slider settings at rest; full-bleed phase color while running, amber flash before each change. */
:root{
  --bg:#f3f4f2; --fg:#16181a; --muted:#5d6468; --card:#ffffff; --line:#dde0dd;
  --work:#d7263d; --rest:#1f8a70; --warn:#ff9f0a; --done:#2b4fd8; --on-phase:#ffffff; --on-warn:#1d1300;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Geist,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111314; --fg:#eef0ee; --muted:#9aa2a6; --card:#1b1e20; --line:#2c3134;
  --work:#c8213a; --rest:#1a7a63; --done:#3456d6; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background-color .2s}
body.work{background:var(--work)} body.rest{background:var(--rest)} body.done{background:var(--done)}
body.work,body.rest,body.done{color:var(--on-phase);--track:rgba(255,255,255,.25);--fill:rgba(255,255,255,.95);--btn:rgba(255,255,255,.18);--btnline:rgba(255,255,255,.5)}
body.warn{background:var(--warn);color:var(--on-warn);--track:rgba(0,0,0,.15);--fill:rgba(0,0,0,.8);--btn:rgba(0,0,0,.1);--btnline:rgba(0,0,0,.35)}
.app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:20px;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.02em;text-transform:uppercase;margin:0}

/* settings */
.setup{display:flex;flex-direction:column;gap:12px}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:baseline;justify-content:space-between}
.head label{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.head label b{width:10px;height:10px;border-radius:50%}
.head output{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;--c:var(--fg)}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--c) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--line)}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:var(--card);border:3px solid var(--c);box-shadow:0 2px 6px color-mix(in srgb,var(--c) 35%,transparent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--card);border:3px solid var(--c)}
input[type=range]:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:8px}
#work{--c:var(--work)} #rest{--c:var(--rest)}
.total{color:var(--muted);font-size:.9rem;text-align:center;font-variant-numeric:tabular-nums}
.go{height:72px;border:0;border-radius:16px;font-family:var(--display);font-weight:800;font-size:1.8rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.go.start{background:var(--work);color:var(--on-phase)}
button:focus-visible{outline:3px solid currentColor;outline-offset:2px}

/* running */
.run{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.phase{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.1em;text-transform:uppercase}
.count{font-family:var(--display);font-weight:800;font-size:min(48vw,13rem);line-height:.9;font-variant-numeric:tabular-nums}
.setinfo{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:18px}
.setlabel{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.setlabel .big{font-size:2rem;font-variant-numeric:tabular-nums}
.setlabel .left{font-size:1.2rem;opacity:.85}
.segs{display:flex;gap:5px;width:100%;height:22px}
.segs i{flex:1;min-width:0;border-radius:5px;background:var(--track);overflow:hidden;position:relative}
.segs i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--f,0%);background:var(--fill)}
.segs.many{height:16px;gap:3px}
.ctrl{display:flex;gap:12px}
.ctrl button{flex:1;background:var(--btn);color:inherit;border:2px solid var(--btnline)}
.ctrl .pause{background:var(--fill);color:var(--bg);border-color:transparent}
body.work .ctrl .pause,body.rest .ctrl .pause,body.done .ctrl .pause{color:#16181a}
body.warn .ctrl .pause{color:var(--warn)}
/* saved workouts */
.presets{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:stretch;border:1px solid var(--line);background:var(--card);border-radius:999px;overflow:hidden;max-width:100%}
.chip button{border:0;background:transparent;color:var(--fg);font:600 .95rem var(--body);cursor:pointer;min-height:44px}
.chip .load{padding:0 6px 0 16px;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .load small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .del{padding:0 14px 0 8px;color:var(--muted);font-size:1.1rem}
.chip.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.chip.confirm{background:var(--work);border-color:var(--work)}
.chip.confirm button,.chip.confirm small{color:#fff}
.saverow{display:flex;gap:8px}
.saverow input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:16px var(--body);padding:0 14px}
.saverow button,.savebtn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 .95rem var(--body);padding:0 16px;cursor:pointer}
.saverow .ok{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.savebtn{align-self:flex-start}
/* tactile press */
button{transition:transform .12s cubic-bezier(.16,1,.3,1)}
button:active{transform:scale(.98)}
.go:active{transform:translateY(1px) scale(.99)}
.empty{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5;border:1px dashed var(--line);border-radius:14px;padding:12px 16px;width:100%}
.err{color:color-mix(in srgb,var(--work) 70%,var(--fg));font-size:.85rem;margin-top:-4px}
.runname{font-size:1rem;font-weight:600;opacity:.85;min-height:1.2em}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="app">
  <section class="setup" id="setup">
    <h1>Interval Timer</h1>
    <div class="presets" id="presets"></div>
    <div class="field">
      <div class="head"><label for="work"><b style="background:var(--work)"></b>Work</label><output id="workv" for="work"></output></div>
      <input id="work" type="range" min="5" max="300" step="5" value="60">
    </div>
    <div class="field">
      <div class="head"><label for="rest"><b style="background:var(--rest)"></b>Rest</label><output id="restv" for="rest"></output></div>
      <input id="rest" type="range" min="0" max="180" step="5" value="30">
    </div>
    <div class="field">
      <div class="head"><label for="sets"><b style="background:var(--fg)"></b>Sets</label><output id="setsv" for="sets"></output></div>
      <input id="sets" type="range" min="1" max="30" step="1" value="8">
    </div>
    <div class="total" id="total"></div>
    <button class="savebtn" id="saveopen">Save as workout</button>
    <form class="saverow" id="saverow" hidden>
      <input id="savename" type="text" maxlength="30" placeholder="Name, e.g. Hill sprints" autocomplete="off" enterkeyhint="done">
      <button type="button" id="savecancel">Cancel</button>
      <button type="submit" class="ok">Save</button>
    </form>
    <div class="err" id="saveerr" role="alert" hidden>Give the workout a name to save it.</div>
    <button class="go start" id="start">Start</button>
  </section>

  <section class="run" id="run" hidden>
    <div class="runname" id="runname"></div>
    <div class="phase" id="phase">Get ready</div>
    <div class="count" id="count">5</div>
    <div class="setinfo">
      <div class="setlabel"><span class="big" id="setnum">Set 1 / 8</span><span class="left" id="setleft"></span></div>
      <div class="segs" id="segs"></div>
    </div>
  </section>
  <div class="ctrl" id="ctrl" hidden>
    <button class="go" id="reset">Stop</button>
    <button class="go pause" id="pause">Pause</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const F={work:$('work'),rest:$('rest'),sets:$('sets')};
const PREP=5;
try{const s=JSON.parse(localStorage.getItem('itimer2')||'null');if(s)for(const k in F)if(s[k]!=null)F[k].value=s[k]}catch(e){}
const val=k=>parseInt(F[k].value)||0;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s)};
const fmtSet=s=>s<60?s+'s':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function sync(){
  for(const k in F){const i=F[k];i.style.setProperty('--p',(100*(i.value-i.min)/(i.max-i.min))+'%')}
  $('workv').textContent=fmtSet(val('work'));$('restv').textContent=val('rest')?fmtSet(val('rest')):'None';$('setsv').textContent=val('sets');
  const t=val('sets')*val('work')+(val('sets')-1)*val('rest');$('total').textContent='Total '+fmt(t)+(t>=60?' min':' sec');
  try{localStorage.setItem('itimer2',JSON.stringify({work:val('work'),rest:val('rest'),sets:val('sets')}))}catch(e){}}
Object.values(F).forEach(i=>i.addEventListener('input',()=>{sync();drawPresets()}));sync();

// saved workouts (stored on this device)
let presets=[];try{presets=JSON.parse(localStorage.getItem('itimer-presets')||'[]')}catch(e){}
const storeP=()=>{try{localStorage.setItem('itimer-presets',JSON.stringify(presets))}catch(e){}};
const cur=()=>({work:val('work'),rest:val('rest'),sets:val('sets')});
const same=(p,c=cur())=>p.work===c.work&&p.rest===c.rest&&p.sets===c.sets;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let confirmIdx=-1;
function drawPresets(){
  $('presets').innerHTML=!presets.length?'<p class="empty">No saved workouts yet. Set work, rest and sets, then tap <b>Save as workout</b>.</p>':presets.map((p,i)=>`<div class="chip${same(p)?' on':''}${confirmIdx===i?' confirm':''}">
    <button class="load" data-i="${i}">${confirmIdx===i?'Delete?':esc(p.name)}<small>${p.sets}× ${fmtSet(p.work)} / ${p.rest?fmtSet(p.rest):'no rest'}</small></button>
    <button class="del" data-i="${i}" aria-label="Delete ${esc(p.name)}">${confirmIdx===i?'✓':'×'}</button></div>`).join('')}
$('presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
  if(b.classList.contains('del')){if(confirmIdx===i){presets.splice(i,1);storeP();confirmIdx=-1}else confirmIdx=i}
  else{if(confirmIdx===i){confirmIdx=-1}else{confirmIdx=-1;const p=presets[i];for(const k in F)F[k].value=p[k];sync()}}
  drawPresets()};
$('saveopen').onclick=()=>{$('saveopen').hidden=true;$('saverow').hidden=false;const m=presets.find(p=>same(p));$('savename').value=m?m.name:'';$('savename').focus()};
const closeSave=()=>{$('saveerr').hidden=true;$('saverow').hidden=true;$('saveopen').hidden=false};
$('savecancel').onclick=closeSave;
$('savename').oninput=()=>{$('saveerr').hidden=true};
$('saverow').onsubmit=e=>{e.preventDefault();const name=$('savename').value.trim();if(!name){$('saveerr').hidden=false;$('savename').focus();return}
  $('saveerr').hidden=true;
  const p={name,...cur()},j=presets.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
  if(j>=0)presets[j]=p;else presets.push(p);storeP();closeSave();drawPresets()};
drawPresets();

// audio + wake lock
let ac;function beep(f=880,d=.12,v=.4){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
let wl;async function wake(){try{wl=await navigator.wakeLock?.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(plan&&!paused&&document.visibilityState==='visible')wake()});

// plan = list of segments; wall-clock based so it never drifts
let plan=null,idx=0,segEnd=0,paused=false,left=0,raf,lastSec=-1,segEls=[];
function build(){const p=[{k:'ready',d:PREP,s:1}],n=val('sets');
  for(let i=1;i<=n;i++){p.push({k:'work',d:val('work'),s:i});if(i<n&&val('rest')>0)p.push({k:'rest',d:val('rest'),s:i})}return p}
const warnFor=d=>d>=15?5:3; // amber lead-in: 5s on longer segments, 3s on short ones
const label=k=>k==='ready'?'Get ready':k==='work'?'Work':'Rest';
function drawSegs(){const n=val('sets');$('segs').innerHTML='<i></i>'.repeat(n);$('segs').classList.toggle('many',n>15);segEls=[...$('segs').children]}
function enter(i){idx=i;const seg=plan[i];segEnd=performance.now()+seg.d*1000;lastSec=-1;
  $('phase').textContent=label(seg.k);
  if(seg.k==='work')beep(1320,.35,.5);else if(seg.k==='rest')beep(520,.35,.5)}
function setProgress(seg,rem){
  const n=val('sets'),w=val('work'),r=seg.s<n?val('rest'):0;
  let f=0;if(seg.k==='work')f=(w-rem)/(w+r);else if(seg.k==='rest')f=(w+r-rem)/(w+r);
  segEls.forEach((el,j)=>el.style.setProperty('--f',(j+1<seg.s?100:j+1===seg.s?Math.min(100,f*100):0)+'%'));
  $('setnum').textContent='Set '+seg.s+' / '+n;
  const l=n-seg.s;$('setleft').textContent=l?l+' left':'Last set'}
function tick(){const now=performance.now();let rem=(segEnd-now)/1000;
  if(rem<=0){if(idx+1<plan.length){enter(idx+1);rem=plan[idx].d}else return finish()}
  const seg=plan[idx],sec=Math.ceil(rem),hasNext=idx+1<plan.length;
  document.body.className=(hasNext&&rem<=warnFor(seg.d))?'warn':(seg.k==='ready'?'rest':seg.k);
  $('count').textContent=fmt(rem);setProgress(seg,rem);
  if(sec!==lastSec){if(sec<=3&&sec>0&&lastSec!==-1)beep(880);lastSec=sec}
  raf=requestAnimationFrame(tick)}
function finish(){cancelAnimationFrame(raf);document.body.className='done';$('phase').textContent='Done';$('count').textContent='✓';
  segEls.forEach(el=>el.style.setProperty('--f','100%'));$('setnum').textContent=val('sets')+' / '+val('sets');$('setleft').textContent='Complete';
  $('pause').hidden=true;$('reset').textContent='Back';
  beep(1320,.2);setTimeout(()=>beep(1320,.2),250);setTimeout(()=>beep(1760,.5),500);plan=null;wl?.release?.()}
$('start').onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  plan=build();paused=false;drawSegs();const m=presets.find(p=>same(p));$('runname').textContent=m?m.name:'';$('setup').hidden=true;$('run').hidden=false;$('ctrl').hidden=false;$('pause').hidden=false;
  $('pause').textContent='Pause';$('reset').textContent='Stop';wake();enter(0);tick()};
$('pause').onclick=()=>{if(!plan)return;if(!paused){paused=true;left=segEnd-performance.now();cancelAnimationFrame(raf);$('pause').textContent='Resume';$('phase').textContent='Paused'}
  else{paused=false;segEnd=performance.now()+left;$('pause').textContent='Pause';$('phase').textContent=label(plan[idx].k);tick()}};
$('reset').onclick=()=>{cancelAnimationFrame(raf);plan=null;document.body.className='';$('setup').hidden=false;$('run').hidden=true;$('ctrl').hidden=true;wl?.release?.()};
</script>
</body>
</html>
